name: Build

# Builds the API and web images on every PR; only main (push or a manual run)
# pushes them to GHCR
# with the monorepo's immutable tags: the 7-char commit and rc-NNNNNNN (the
# run number), which Kargo's Warehouse promotes. No env-* or latest: Kargo
# pins each environment's tag in meanwhile/argocd instead.
on:
  pull_request:
  push:
    branches: [main]
  # Rebuild main by hand: a new rc-* tag for Kargo without a code change.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.image }}
    # The EKS node pools are arm64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tags
        id: tags
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short=7 HEAD)
          release=$(printf 'rc-%07d' "$GITHUB_RUN_NUMBER")
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER}/sample-app-${{ matrix.image }}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tags=$repo:$sha,$repo:$release" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          platforms: linux/arm64
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            VERSION_COMMIT=${{ steps.tags.outputs.sha }}
            VERSION_RELEASE=${{ steps.tags.outputs.release }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
